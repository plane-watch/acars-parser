# The acars_parser stack: ClickHouse (message archive), PostgreSQL (state),
# the live ingester and a read-only web viewer for the state database. See
# docs/deployment.md.
#
# Usage, from the repository root:
#   docker compose -f deployments/docker-compose.yml up -d clickhouse postgres
#   docker compose -f deployments/docker-compose.yml run --rm schema
#   docker compose -f deployments/docker-compose.yml up -d live
#   docker compose -f deployments/docker-compose.yml run --rm dbviewer-role
#   docker compose -f deployments/docker-compose.yml up -d dbviewer
name: acars

services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.12
    container_name: acars-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: acars
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-acars}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:8123:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --password \"$$CLICKHOUSE_PASSWORD\" --query 'SELECT 1'"]
      interval: 10s
      retries: 12
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  postgres:
    image: postgres:16-alpine
    container_name: acars-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: acars
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acars}
      POSTGRES_DB: acars_state
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acars -d acars_state"]
      interval: 10s
      retries: 5

  # One-off: creates the ClickHouse and PostgreSQL tables without copying any
  # SQLite data.
  schema:
    build:
      context: ..
      dockerfile: cmd/acars_parser/Dockerfile
    image: acars_parser:local
    profiles: ["tools"]
    environment: &db-env
      CLICKHOUSE_HOST: clickhouse
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-acars}
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-acars}
    command: ["migrate", "-skip-messages", "-skip-state"]
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy

  # One-off: creates or updates the read-only role that dbviewer connects as.
  # Idempotent; run it once before the first "up dbviewer", and again after a
  # change to DBVIEWER_PASSWORD.
  dbviewer-role:
    image: postgres:16-alpine
    profiles: ["tools"]
    environment:
      PGHOST: postgres
      PGUSER: acars
      PGDATABASE: acars_state
      PGPASSWORD: ${POSTGRES_PASSWORD:-acars}
      VIEWER_PASSWORD: ${DBVIEWER_PASSWORD:-acars_viewer}
    # $$ stops Compose from interpolating; the shell in the container expands
    # VIEWER_PASSWORD, so the password does not appear in the command line
    # that Compose records.
    command:
      - sh
      - -c
      - psql -X -v viewer_role=acars_viewer -v "viewer_password=$$VIEWER_PASSWORD" -f /dbviewer-role.sql
    volumes:
      - ./postgres/dbviewer-role.sql:/dbviewer-role.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # A read-only web interface to the PostgreSQL state database (pgweb).
  # It has no authentication: anyone who can reach the port can read every
  # table. See docs/deployment.md.
  dbviewer:
    image: sosedoff/pgweb:0.17.0
    container_name: acars-dbviewer
    restart: unless-stopped
    environment:
      # Read by the PostgreSQL driver, so the password stays out of the
      # command line.
      PGPASSWORD: ${DBVIEWER_PASSWORD:-acars_viewer}
    command:
      - pgweb
      - --bind=0.0.0.0
      - --listen=8081
      - --host=postgres
      - --user=acars_viewer
      - --db=acars_state
      - --ssl=disable
      - --readonly
      - --lock-session
      - --skip-open
    ports:
      - "${DBVIEWER_BIND:-0.0.0.0}:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy

  live:
    build:
      context: ..
      dockerfile: cmd/acars_parser/Dockerfile
    image: acars_parser:local
    container_name: acars-live
    restart: unless-stopped
    environment: *db-env
    # The NATS credentials file stays outside the repository and the image.
    command: ["live", "-creds", "/run/secrets/airframes_nats.creds", "-exclude", ""]
    # NATS_CREDS is read only when the service is created, so other commands
    # work without it; a missing file stops "up live" rather than being
    # created as an empty directory.
    volumes:
      - type: bind
        source: ${NATS_CREDS:-/run/acars/nats-credentials-not-set}
        target: /run/secrets/airframes_nats.creds
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      clickhouse:
        condition: service_healthy
      postgres:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  clickhouse-data:
  postgres-data:
